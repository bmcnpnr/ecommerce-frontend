server {
    listen 80;
    # Also accept IPv6: container tooling resolves 'localhost' to ::1 first.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required because the proxy_pass directives below
    # resolve their upstream at request time via a variable — see the note there.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ─── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ─── nginx metrics for nginx-prometheus-exporter ────────────────────────
    # Without this, the exporter's scrape of /stub_status falls through to the
    # SPA fallback and receives HTML, so every nginx_* metric goes missing.
    # Restricted to RFC1918 so it is not reachable from outside the network.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # ─── API proxy → api-gateway ────────────────────────────────────────────
    # All /api requests are forwarded to the API Gateway within the Docker
    # network. The browser never needs to know the gateway's address.
    # '^~' so this wins over the static-asset regex below: without it, a request
    # such as /api/v1/products/logo.png would be matched by the regex location
    # and 404 instead of being proxied.
    # A literal hostname in proxy_pass is resolved once at startup and the IP is
    # cached for the life of the worker. Recreating api-gateway gives it a new
    # container IP, and nginx keeps dialling the old one until it is restarted —
    # every /api call then fails with 502. Going through a variable forces
    # re-resolution against the resolver above; $request_uri is then required
    # because the variable form no longer forwards the original URI implicitly.
    location ^~ /api/ {
        set                $api_gateway api-gateway;
        proxy_pass         http://$api_gateway:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── Actuator proxy (optional – useful for health checks) ───────────────
    location ^~ /actuator/ {
        set                $actuator_gateway api-gateway;
        proxy_pass         http://$actuator_gateway:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
    }

    # ─── Static assets – long-lived cache ───────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── SPA fallback – all other routes → index.html ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
